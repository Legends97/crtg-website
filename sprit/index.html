<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>document.documentElement.dataset.theme=localStorage.getItem("crtg-theme")||"dark"</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRTG Sprit-Rechner</title>
<style>
.pageHead{padding:12px 8vw 0}
.pageHead h2{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(2rem,4vw,3rem);margin:0}
.pageBody{padding:36px 8vw 10vh}
.calcGrid{display:grid;grid-template-columns:.8fr 1.4fr;gap:48px;align-items:start}
@media(max-width:860px){.calcGrid{grid-template-columns:1fr}}
.fieldGroup{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:.95rem;color:var(--mute);margin:24px 0 10px;letter-spacing:.02em}
.fieldGroup:first-child{margin-top:0}
.fieldRow{display:flex;gap:14px}
.fieldRow .field{flex:1}
.field{margin-bottom:16px}
.field label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:6px}
.field input{width:100%;background:var(--panel2);border:none;border-radius:3px;color:var(--text);font:1rem var(--mono);padding:11px 12px;transition:background 160ms ease}
.field input:focus{outline:2px solid var(--cy);outline-offset:1px}
.sumRow{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:24px}
.sumRow .chip{background:none;border-radius:0;padding:0;min-width:0}
.sumRow .chip .v{font-family:var(--disp);font-size:1.8rem;font-weight:600;color:var(--cy)}
.sumRow .chip .k{font-size:.82rem;color:var(--mute)}
.stintPlan{display:flex;flex-direction:column;gap:2px}
.stintPlanRow{display:grid;grid-template-columns:34px repeat(4,1fr);gap:18px;align-items:center;background:var(--panel2);border-left:3px solid var(--vi);padding:16px 20px}
.stintPlanRow.bad{border-left-color:#ff6b6b}
.stintPlanRow.bad .spNum{color:#ff6b6b}
.spNum{font-family:var(--disp);font-style:italic;font-size:1.4rem;color:var(--vi);font-weight:600}
.spK{font-size:.78rem;color:var(--mute)}
.spV{font-size:1.02rem;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.spFlag{grid-column:1/-1;color:#ff8a8a;font-size:.85rem}
@media(max-width:700px){.stintPlanRow{grid-template-columns:24px 1fr 1fr;row-gap:10px}}
.calcNote{color:var(--mute);font-size:.86rem;line-height:1.6;margin:22px 0}
.err{color:#ff8a8a;padding:10px 0}
.empty{color:var(--mute);padding:14px 0}
.printBtn{background:var(--panel2);color:var(--text);border-radius:3px;padding:12px 22px;font-weight:600;transition:background 160ms ease,transform 120ms ease-out}
.printBtn:hover{background:var(--line)}
.printBtn:active{transform:scale(.97)}
@media print{
@page{size:A4 portrait;margin:14mm}
body{background:#fff;color:#111}
.cfg,.printBtn,.kerb,.tireBand{display:none!important}
.pageHead,.pageBody{padding:0}
.calcGrid{display:block}
.sumRow .chip .v{color:#111}
.stintPlanRow{background:#fff;border:1px solid #bbb;border-left:4px solid #555;break-inside:avoid}
}
</style>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<main>
  <div class="pageHead"><h2>Sprit-Rechner</h2></div>
  <div class="kerb"></div>
  <div class="pageBody">
    <div class="calcGrid">
      <div class="cfg">
        <div class="fieldGroup">Rennen</div>
        <div class="fieldRow">
          <div class="field"><label for="h">Stunden</label><input id="h" type="number" min="0" max="48"></div>
          <div class="field"><label for="m">Minuten</label><input id="m" type="number" min="0" max="59"></div>
        </div>
        <div class="field"><label for="lap">Rundenzeit (m:ss.x)</label><input id="lap" placeholder="1:48.5"></div>
        <div class="field"><label for="stint">Stint-Zeit (Minuten)</label><input id="stint" type="number" min="0" placeholder="leer = automatisch nach Tank"></div>
        <div class="fieldGroup">Auto</div>
        <div class="field"><label for="cons">Verbrauch pro Runde (Liter)</label><input id="cons" type="number" step="0.01" min="0"></div>
        <div class="field"><label for="tank">Tankgröße (Liter)</label><input id="tank" type="number" step="1" min="0"></div>
        <div class="field"><label for="res">Reserve (Runden)</label><input id="res" type="number" step="1" min="0"></div>
      </div>
      <div>
        <div class="sumRow" id="stats"></div>
        <div id="plan"></div>
        <p class="calcNote" id="hint"></p>
        <button type="button" class="go printBtn" onclick="window.print()">Drucken / PDF</button>
      </div>
    </div>
  </div>
</main>
<div class="tireBand"><img src="../img/tires.jpg" alt="Renn-Slicks auf Felgen, Boxengasse"></div>
<script>
const $=id=>document.getElementById(id),KEY="crtg-sprit-v1",KEYS=["h","m","lap","cons","tank","res","stint"];
let S={h:3,m:0,lap:"1:48.5",cons:3.1,tank:120,res:1,stint:40};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x)}catch(e){}
const lapSec=v=>{v=String(v).trim().replace(",",".");const m=v.match(/^(\d+):(\d+(?:\.\d+)?)$/);return m?+m[1]*60+ +m[2]:(/^\d+(\.\d+)?$/.test(v)?+v:0)};
const hm=t=>Math.floor(t/60)+":"+String(Math.round(t%60)).padStart(2,"0");
const L=n=>(Math.round(n*10)/10).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const chip=(v,k)=>`<div class="chip"><span class="v">${v}</span><span class="k">${k}</span></div>`;
function calc(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  const Tm=(+S.h||0)*60+(+S.m||0),lap=lapSec(S.lap),c=+S.cons,tank=+S.tank,res=Math.max(0,+S.res||0),sm=+S.stint||0;
  $("hint").textContent="";
  if(!(Tm>0&&lap>0&&c>0&&tank>0)){$("stats").innerHTML="";$("plan").innerHTML='<p class="empty">Trage Renndauer, Rundenzeit, Verbrauch und Tankgröße ein.</p>';return}
  const maxLaps=Math.floor(tank/c)-res;
  if(maxLaps<1){$("stats").innerHTML="";$("plan").innerHTML='<p class="err">Der Tank reicht mit dieser Reserve nicht für eine ganze Runde.</p>';return}
  const laps=Math.ceil(Tm*60/lap),list=[];
  if(sm>0){
    const cnt=Math.ceil(Tm/sm);
    for(let i=0;i<cnt;i++){const s=i*sm,e=Math.min(Tm,(i+1)*sm);list.push({s,e,n:Math.ceil((e-s)*60/lap)})}
  }else{
    const cnt=Math.ceil(laps/maxLaps),base=Math.floor(laps/cnt),extra=laps%cnt;let done=0;
    for(let i=0;i<cnt;i++){const n=base+(i<extra?1:0);list.push({s:done*lap/60,e:Math.min(Tm,(done+n)*lap/60),n});done+=n}
  }
  const bad=list.filter(x=>x.n>maxLaps).length;
  $("stats").innerHTML=chip(list.length,"Stints")+chip(list.length-1,"Boxenstopps")+chip(laps,"Runden (ca.)")+chip(L((laps+res)*c)+" L","Sprit gesamt inkl. Reserve")+chip(maxLaps,"Max. Runden pro Tank");
  $("plan").innerHTML='<div class="stintPlan">'+list.map((x,i)=>{
    const b=x.n>maxLaps,fill=Math.min(tank,(x.n+res)*c);
    return `<div class="stintPlanRow${b?" bad":""}"><div class="spNum">${i+1}</div>`
      +`<div><div class="spK">Zeit</div><div class="spV">${hm(x.s)} – ${hm(x.e)}</div></div>`
      +`<div><div class="spK">Runden (ca.)</div><div class="spV">${x.n}</div></div>`
      +`<div><div class="spK">Tankinhalt ${i?"nach dem Stopp":"beim Start"}</div><div class="spV">${L(fill)} L</div></div>`
      +(i?`<div><div class="spK">Nachtanken</div><div class="spV">${L(x.n*c)} L</div></div>`:"")
      +(b?`<div class="spFlag">Tank reicht hier nicht: höchstens ${maxLaps} Runden pro Füllung. Plane einen zusätzlichen Spritstopp oder einen kürzeren Stint.</div>`:"")
      +"</div>";
  }).join("")+'</div>';
  $("hint").textContent=(bad?bad+" Stint"+(bad>1?"s sind":" ist")+" für eine Tankfüllung zu lang. ":"")+"Richtwerte: „Nachtanken“ geht davon aus, dass du mit der Reserve in die Box kommst. Boxenzeit und Tankdauer sind nicht eingerechnet. Das Rennen endet meist eine Runde nach Ablauf der Zeit. Verbrauch im Training über mehrere Runden messen.";
}
function sync(){KEYS.forEach(k=>$(k).value=S[k])}
KEYS.forEach(k=>{$(k).oninput=e=>{S[k]=e.target.value;calc()}});
sync();calc();
</script>
<script src="../nav.js"></script>
</body>
</html>
