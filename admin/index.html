<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – CRTG</title>
<style>
.pageHead{padding:12px 8vw 0}
.pageBody{padding:36px 8vw 10vh}
h1{margin:0;font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(2rem,4vw,3rem);color:var(--text)}
.sub{color:var(--mute);margin:-14px 0 24px}
.warn{background:rgba(255,169,77,.12);border-left:3px solid #ffa94d;border-radius:3px;padding:10px 14px;margin-bottom:14px}
.warn:empty,[hidden]{display:none!important}
.adminBar{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.searchInput{flex:1;min-width:220px;background:var(--panel2);border:none;border-radius:999px;color:var(--text);font:1rem var(--body);padding:11px 18px}
.searchInput:focus{outline:2px solid var(--cy);outline-offset:1px}
.searchInput::placeholder{color:var(--mute)}
.addBtn{background:var(--vi);color:#fff;border:none;border-radius:999px;padding:11px 22px;font-weight:600;white-space:nowrap;transition:background 160ms ease,transform 120ms ease-out}
.addBtn:hover{background:#b34de0}
.addBtn:active{transform:scale(.97)}
.tw{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:760px}
.table th{text-align:left;font-weight:600;color:var(--mute);padding:10px 16px;border-bottom:1px solid var(--line)}
.table td{padding:14px 16px;border-bottom:1px solid var(--bg)}
tr.off td{opacity:.5}
.miss{color:#ffa94d}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.role.admin{color:var(--vi);font-weight:600}
.classPicker{display:flex;gap:5px;flex-wrap:wrap;max-width:220px}
.classChip{font-family:var(--mono);font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--panel2);color:var(--mute);border:1px solid var(--line);transition:background 140ms ease,color 140ms ease,border-color 140ms ease,transform 120ms ease-out}
.classChip:hover{border-color:var(--cy)}
.classChip:active{transform:scale(.94)}
.classChip.on{background:rgba(162,50,207,.18);color:var(--vi);border-color:var(--vi)}
.rowBtn{background:var(--panel2);color:var(--text);border:none;border-radius:999px;padding:7px 16px;font-size:.85rem;white-space:nowrap;margin-right:6px;transition:background 160ms ease,transform 120ms ease-out}
.rowBtn:hover{background:var(--line)}
.rowBtn:active{transform:scale(.96)}
.rowBtn.danger:hover{color:#ff6b6b}
#empty,#gate{color:var(--mute);padding:18px 0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;width:min(480px,92vw);padding:22px}
dialog::backdrop{background:rgba(5,7,16,.72)}
dialog input,dialog select{width:100%;background:var(--panel2);color:var(--text);border:none;border-radius:3px;padding:11px 12px}
dialog input{font:1rem var(--mono)}
dialog select{font:1rem var(--body)}
dialog input:focus,dialog select:focus{outline:2px solid var(--cy);outline-offset:1px}
dialog label{display:block;color:var(--mute);font-size:.85rem;margin:12px 0 4px}
dialog .hint{color:var(--mute);font-size:.8rem;margin-top:4px}
dialog .err{color:#ff8a8a;min-height:1.4em;margin:12px 0 0}
dialog .row{display:flex;gap:10px;margin-top:8px;align-items:center}
</style>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<main>
  <div id="gate" hidden></div>
  <div id="app">
    <div class="pageHead"><h1>Fahrer-Verwaltung</h1></div>
    <div class="kerb"></div>
    <div class="pageBody">
    <p class="sub">Konten, Discord-IDs und Steam-IDs des Teams</p>
    <div class="warn" id="warn" role="status"></div>
    <div class="adminBar"><input class="searchInput" id="q" type="search" placeholder="Suchen (Name, Discord-ID, Steam-ID)" aria-label="Suchen"><button class="go addBtn" id="new" type="button">Fahrer anlegen</button></div>
    <div class="tw"><table class="table"><thead><tr><th>Name</th><th>Fahrernummer</th><th>Discord-ID</th><th>Steam-ID</th><th>Rolle</th><th>Klassen</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>Keine Fahrer gefunden.</div></div>
    </div>
  </div>
</main>
<div class="tireBand"><img src="../img/tires.jpg" alt="Renn-Slicks auf Felgen, Boxengasse"></div>
<dialog id="dlg">
  <form id="f">
    <h2 id="ttl" style="margin:0">Fahrer</h2>
    <label for="fn">Anzeigename</label><input id="fn" required maxlength="60">
    <label for="fnr">Fahrernummer</label><input id="fnr" inputmode="numeric" placeholder="z. B. 12">
    <label for="fd">Discord-ID</label><input id="fd" inputmode="numeric" placeholder="17 bis 19 Ziffern">
    <label for="fs">Steam-ID (SteamID64)</label><input id="fs" placeholder="76561198000000000">
    <div class="hint">Mit oder ohne S, sie wird automatisch auf S + 17 Ziffern gesetzt. Ein leeres Feld löst die Verknüpfung.</div>
    <label for="fr">Rolle</label><select id="fr"><option value="driver">Fahrer</option><option value="admin">Admin</option></select>
    <label class="row" id="far"><input type="checkbox" id="fa" style="width:auto"> Konto aktiv</label>
    <div class="err" id="err" role="alert"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="rowBtn" id="cancel">Abbrechen</button><button class="go addBtn">Speichern</button></div>
  </form>
</dialog>
<script src="../nav.js"></script>
<script>
const $=id=>document.getElementById(id);
async function api(path,opt){
  const r=await fetch(path,Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},opt));
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(d.error||"Fehler"),{status:r.status});
  return d;
}
let list=[],editId=null,timer;
const CAR_CLASSES=["GT2","GT3","GT4","CUP","ST","CHL","TCX"];
function cell(tr,txt,cls){const td=document.createElement("td");td.textContent=txt;if(cls)td.className=cls;tr.appendChild(td);return td}
async function load(){
  try{
    const d=await api("/api/admin/users?q="+encodeURIComponent($("q").value.trim()));
    list=d.users;
    $("warn").innerHTML="";
    [[d.warnings.noDiscord,"aktive Fahrer ohne Discord-ID (kein Login, keine Erinnerung)"],[d.warnings.noSteam,"aktive Fahrer ohne Steam-ID (keine Verknüpfung mit Ergebnissen)"]].forEach(([n,t])=>{
      if(n){const p=document.createElement("div");p.textContent="Achtung: "+n+" "+t;$("warn").appendChild(p)}});
    const tb=$("rows");tb.innerHTML="";
    list.forEach(u=>{
      const tr=document.createElement("tr");if(!u.active)tr.className="off";
      cell(tr,u.display_name);
      cell(tr,u.car_number!=null?"#"+u.car_number:"–","mono");
      cell(tr,u.discord_id||"fehlt",u.discord_id?"mono":"miss");
      cell(tr,u.steam_id||"fehlt",u.steam_id?"mono":"miss");
      const r=cell(tr,""),tag=document.createElement("span");tag.className="role"+(u.role==="admin"?" admin":"");tag.textContent=u.role==="admin"?"Developer":"Fahrer";r.appendChild(tag);
      const clsTd=cell(tr,"");
      const picker=document.createElement("div");picker.className="classPicker";
      picker.innerHTML=CAR_CLASSES.map(c=>'<button type="button" class="classChip'+(u.classes&&u.classes.includes(c)?" on":"")+'" data-c="'+c+'">'+c+"</button>").join("");
      picker.onclick=async e=>{
        const b=e.target.closest(".classChip");if(!b)return;
        const c=b.dataset.c;
        const next=(u.classes||[]).includes(c)?u.classes.filter(x=>x!==c):[...(u.classes||[]),c];
        try{await api("/api/admin/users/"+u.id,{method:"PATCH",body:JSON.stringify({classes:next})});u.classes=next;b.classList.toggle("on")}
        catch(err){alert(err.message)}
      };
      clsTd.appendChild(picker);
      cell(tr,u.active?"aktiv":"deaktiviert");
      const a=cell(tr,"");
      [["Bearbeiten",()=>openEdit(u),""],[u.active?"Deaktivieren":"Aktivieren",()=>toggle(u),u.active?" danger":""]].forEach(([t,f,cls])=>{
        const b=document.createElement("button");b.type="button";b.className="go rowBtn"+cls;b.textContent=t;b.onclick=f;a.appendChild(b)});
      tb.appendChild(tr);
    });
    $("empty").hidden=list.length>0;
  }catch(e){
    $("app").hidden=true;$("gate").hidden=false;
    $("gate").textContent=e.status===401?"Bitte melde dich zuerst an. ":e.status===403?"Dieser Bereich ist nur für Admins.":e.message;
    if(e.status===401){const a=document.createElement("a");a.href="/login.html";a.className="go addBtn";a.textContent="Zur Anmeldung";$("gate").appendChild(a)}
  }
}
function openEdit(u){
  editId=u?u.id:null;$("err").textContent="";
  $("ttl").textContent=u?"Fahrer bearbeiten":"Fahrer anlegen";
  $("fn").value=u?u.display_name:"";$("fnr").value=u?.car_number??"";$("fd").value=u?.discord_id||"";$("fs").value=u?.steam_id||"";
  $("fr").value=u?u.role:"driver";$("fa").checked=u?u.active:true;$("far").hidden=!u;
  $("dlg").showModal();
}
async function toggle(u){try{await api("/api/admin/users/"+u.id,{method:"PATCH",body:JSON.stringify({active:!u.active})});load()}catch(e){alert(e.message)}}
$("new").onclick=()=>openEdit(null);
$("cancel").onclick=()=>$("dlg").close();
$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
$("f").onsubmit=async e=>{
  e.preventDefault();$("err").textContent="";
  const body={display_name:$("fn").value,car_number:$("fnr").value,discord_id:$("fd").value,steam_id:$("fs").value,role:$("fr").value};
  try{
    if(editId){body.active=$("fa").checked;await api("/api/admin/users/"+editId,{method:"PATCH",body:JSON.stringify(body)})}
    else await api("/api/admin/users",{method:"POST",body:JSON.stringify(body)});
    $("dlg").close();load();
  }catch(x){$("err").textContent=x.message}
};
load();
</script>
</body>
</html>
