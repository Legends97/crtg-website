<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine kommenden Stints</title>
<style>
.pageHead{padding:26px 8vw 0}
.pageHead h2{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(2rem,4vw,3rem);margin:0}
.pageBody{padding:36px 8vw 10vh}
.eventGroup{margin-bottom:52px}
.eventGroup:last-child{margin-bottom:0}
.eventName{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:1.1rem;margin:0 0 20px}
.eventName .trk{color:var(--mute);font-weight:400;text-transform:none;font-size:.9rem;font-family:var(--body)}
.meineLayout{display:grid;grid-template-columns:1.3fr .9fr;gap:52px;align-items:start}
@media(max-width:900px){.meineLayout{grid-template-columns:1fr}}
.timeline{margin:0 0 28px}
.tlTrack{position:relative;height:64px;background:var(--panel2);border-radius:3px}
.tlStint{position:absolute;top:0;bottom:0;background:var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--mono);font-size:.74rem;color:var(--mute);overflow:hidden}
.tlStint .num{font-size:.72rem;opacity:.85}
.tlStint.mine{background:var(--vi);color:#1a0624;font-weight:600}
.tlStint.past{opacity:.45;filter:grayscale(.5)}
.tlNow{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--cy)}
.tlNow::after{content:"jetzt";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--cy);font-family:var(--mono);white-space:nowrap}
.stintList{margin-top:18px;display:flex;flex-direction:column;gap:2px}
.stintRow{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--panel2);gap:12px}
.tag2{font-size:.82rem;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap}
.tag2.live{background:rgba(9,142,223,.18);color:var(--cy)}
.tag2.upcoming{background:rgba(162,50,207,.16);color:var(--vi)}
.tag2.done{background:var(--panel2);color:var(--mute)}
.trackBox{display:flex;flex-direction:column;align-items:center}
@media(max-width:900px){.trackBox{order:-1}}
.back{color:var(--cy);text-decoration:none}
.back:hover{text-decoration:underline}
.empty{color:var(--mute);padding:30px 0}
.carDot{offset-rotate:0deg;offset-distance:0%;animation:driveAlong 16s linear infinite}
@keyframes driveAlong{to{offset-distance:100%}}
@media(prefers-reduced-motion:reduce){.carDot{display:none}}
</style>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><clipPath id="logoClip" clipPathUnits="userSpaceOnUse"><circle cx="0" cy="0" r="7.5"/></clipPath></defs></svg>
<main>
  <div class="pageHead"><h2>Meine Stints</h2></div>
  <div class="kerb"></div>
  <div class="pageBody">
    <div id="list"><p class="empty">Lädt …</p></div>
  </div>
</main>
<div class="tireBand"><img src="../img/tires.jpg" alt="Renn-Slicks auf Felgen, Boxengasse"></div>
<script src="../tracks-data.js"></script>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=iso=>new Date(iso).toLocaleString(undefined,{weekday:"short",hour:"2-digit",minute:"2-digit"});
function trackSvgHtml(trackName){
  const slug=typeof TRACK_SLUG!=="undefined"&&TRACK_SLUG[trackName];
  const t=slug&&TRACKS_DATA[slug];
  if(!t)return "";
  const corners=t.corners.map(c=>'<circle cx="'+c[0]+'" cy="'+c[1]+'" r="3.5" style="fill:var(--vi)"/>'
    +'<text x="'+c[0]+'" y="'+(c[1]-7)+'" style="font-family:var(--mono);font-size:8px;fill:var(--mute);text-anchor:middle">'+esc(c[2])+'</text>').join("");
  const carD=t.paths[0].replace(/'/g,"\\'");
  return '<div class="trackBox"><svg viewBox="'+t.viewBox+'" style="width:100%;max-width:280px;opacity:.95;overflow:visible">'
    +'<path style="fill:none;stroke:var(--line);stroke-width:14;stroke-linecap:round;stroke-linejoin:round" d="'+t.paths[0]+'"/>'
    +'<g class="carDot" style="offset-path:path(\''+carD+'\')"><circle r="9.5" fill="var(--bg)" style="filter:drop-shadow(0 0 3px var(--cy)) drop-shadow(0 0 8px var(--vi))"/><circle r="9.5" fill="none" stroke="var(--cy)" stroke-width="1.5"/><image href="../icon.png" x="-7.5" y="-7.5" width="15" height="15" clip-path="url(#logoClip)"/></g>'
    +corners+'</svg><div style="font-size:.85rem;color:var(--mute);text-align:center;margin-top:6px">'+esc(t.name)+'</div></div>';
}
function tagOf(s,now){
  const start=new Date(s.start_at), end=new Date(s.end_at);
  if(start<=now&&now<end)return {cls:"live",label:"läuft"};
  if(end<=now)return {cls:"done",label:"vorbei"};
  return {cls:"upcoming",label:"kommend"};
}
function render(){
  const box=document.getElementById("list");
  let myDiscordId=null;
  fetch("../api/me",{credentials:"same-origin"}).then(r=>{
    if(r.status===401)return null;
    if(!r.ok)return Promise.reject();
    return r.json();
  }).then(me=>{
    if(!me){box.innerHTML='<p class="empty">Bitte anmelden.</p>';return null;}
    myDiscordId=me.discord_id;
    return fetch("../api/v1/drivers/"+me.discord_id+"/stints",{credentials:"same-origin"}).then(r=>r.ok?r.json():Promise.reject());
  }).then(data=>{
    if(!data)return null;
    const stints=data.stints||[];
    if(!stints.length){
      box.innerHTML='<p class="empty">Keine kommenden Stints. <a class="back" href="../stintplan/">Zum Stintplaner →</a></p>';
      return null;
    }
    const groups=[], byId=new Map();
    stints.forEach(s=>{
      let g=byId.get(s.event.id);
      if(!g){g={event:s.event,stints:[]};byId.set(s.event.id,g);groups.push(g);}
      g.stints.push(s);
    });
    return Promise.all(groups.map(g=>
      fetch("../api/v1/events/"+g.event.id,{credentials:"same-origin"}).then(r=>r.ok?r.json():null).catch(()=>null)
    )).then(details=>({groups,details}));
  }).then(res=>{
    if(!res)return;
    const now=new Date();
    box.innerHTML=res.groups.map((g,gi)=>{
      const full=res.details[gi];
      const all=full&&full.stints&&full.stints.length?full.stints:g.stints;
      const t0=new Date(all[0].start_at).getTime(),t1=new Date(all[all.length-1].end_at).getTime(),span=Math.max(1,t1-t0);
      const track=all.length?'<div class="tlTrack">'+all.map(s=>{
        const mine=s.assigned_user&&s.assigned_user.discord_id===myDiscordId;
        const start=new Date(s.start_at).getTime(),end=new Date(s.end_at).getTime();
        const left=(start-t0)/span*100,width=(end-start)/span*100,past=end<=now.getTime();
        const who=s.assigned_user?esc(s.assigned_user.display_name):"frei";
        return '<div class="tlStint'+(mine?" mine":"")+(past?" past":"")+'" style="left:'+left+'%;width:'+width+'%" title="'+who+'">S'+s.number+'<span class="num">'+(s.assigned_user?"#"+(s.assigned_user.car_number??""):"frei")+'</span></div>';
      }).join("")
        +(now.getTime()>=t0&&now.getTime()<=t1?'<div class="tlNow" style="left:'+((now.getTime()-t0)/span*100)+'%"></div>':"")
        +'</div>':"";
      const rows=g.stints.map(s=>{
        const tag=tagOf(s,now);
        const info=[];
        if(s.fuel_liters!=null)info.push(s.fuel_liters.toFixed(1)+" l");
        if(s.pit_stops!=null)info.push(s.pit_stops+" Boxenstopp"+(s.pit_stops===1?"":"s"));
        return '<div class="stintRow"><div>S'+s.number+' · '+esc(fmt(s.start_at))+'–'+esc(fmt(s.end_at))+(info.length?' · '+esc(info.join(" · ")):"")+'</div>'
          +'<span class="tag2 '+tag.cls+'">'+tag.label+'</span></div>';
      }).join("");
      return '<div class="eventGroup"><h3 class="eventName">'+esc(g.event.name||"")+(g.event.track?' <span class="trk">· '+esc(g.event.track)+'</span>':"")+'</h3>'
        +'<div class="meineLayout"><div><div class="timeline">'+track+'</div><div class="stintList">'+rows+'</div></div>'
        +trackSvgHtml(g.event.track)+'</div></div>';
    }).join("");
  }).catch(()=>{box.innerHTML='<p class="empty">Konnte Daten nicht laden.</p>'});
}
render();
</script>
<script src="../nav.js"></script>
</body>
</html>
