<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine kommenden Stints</title>
<style>
:root{color-scheme:dark;--bg:#0b0e1b;--panel2:#1a2040;--line:#2a3157;--text:#eaedfa;--mute:#8f98bd;--cy:#2bd0ff;--vi:#9b6bff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.45 "Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
background:radial-gradient(900px 500px at 8% -10%,rgba(43,208,255,.16),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(155,107,255,.18),transparent 60%),var(--bg)}
header{max-width:860px;margin:auto;padding:26px 24px 14px}
h1{margin:0;font-size:2.2rem;font-style:italic;font-weight:800;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sub{color:var(--mute);margin-top:2px}
.stripe{height:4px;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,var(--cy),var(--vi) 60%,transparent)}
main{max-width:860px;margin:auto;padding:8px 24px 48px}
.event{margin-bottom:22px}
.event h2{margin:0 0 8px;font-size:1.1rem;font-weight:700}
.event h2 .trk{color:var(--mute);font-weight:400;font-size:.9rem}
.stint{display:flex;align-items:center;gap:16px;background:rgba(19,24,48,.88);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.stint .n{width:36px;font-size:1.5rem;font-weight:800;font-style:italic;color:var(--c)}
.stint .t{font-variant-numeric:tabular-nums;font-weight:600;min-width:220px}
.stint .track{flex:1;color:var(--mute);min-width:0}
.tag{font-size:.75rem;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mute);white-space:nowrap}
.tag.now{color:var(--cy);border-color:var(--cy)}
.empty{color:var(--mute);padding:30px 0}
.back{color:var(--cy);text-decoration:none}
.back:hover{text-decoration:underline}
</style>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<header>
  <h1>Meine kommenden Stints</h1>
  <div class="sub">ChaosRacing – Team Germany</div>
  <div class="stripe"></div>
</header>
<main>
  <div id="list"><p class="empty">Lädt …</p></div>
</main>
<script>
const COLORS=["#2bd0ff","#9b6bff","#ffa94d","#3ddc97","#ff5d6c","#ffd93d","#b9805a","#e9ecf8","#8a93b8"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=iso=>new Date(iso).toLocaleString(undefined,{weekday:"short",hour:"2-digit",minute:"2-digit"});
function tagOf(s,now){
  const start=new Date(s.start_at), end=new Date(s.end_at);
  if(start<=now&&now<end)return {cls:" now",label:"läuft"};
  if(end<=now)return {cls:"",label:"vorbei"};
  return {cls:"",label:"kommend"};
}
function render(){
  const box=document.getElementById("list");
  fetch("../api/me",{credentials:"same-origin"}).then(r=>{
    if(r.status===401)return null;
    if(!r.ok)return Promise.reject();
    return r.json();
  }).then(me=>{
    if(!me){box.innerHTML='<p class="empty">Bitte anmelden.</p>';return null;}
    return fetch("../api/v1/drivers/"+me.discord_id+"/stints",{credentials:"same-origin"}).then(r=>r.ok?r.json():Promise.reject());
  }).then(data=>{
    if(!data)return;
    const stints=data.stints||[];
    if(!stints.length){
      box.innerHTML='<p class="empty">Keine kommenden Stints. <a class="back" href="../stintplan/">Zum Stintplaner →</a></p>';
      return;
    }
    const now=new Date();
    const groups=[], byId=new Map();
    stints.forEach(s=>{
      let g=byId.get(s.event.id);
      if(!g){g={event:s.event,stints:[]};byId.set(s.event.id,g);groups.push(g);}
      g.stints.push(s);
    });
    box.innerHTML=groups.map((g,gi)=>{
      const c=COLORS[gi%COLORS.length];
      const rows=g.stints.map(s=>{
        const tag=tagOf(s,now);
        const info=[];
        if(s.fuel_liters!=null)info.push(s.fuel_liters.toFixed(1)+" l");
        if(s.pit_stops!=null)info.push(s.pit_stops+" Boxenstopp"+(s.pit_stops===1?"":"s"));
        return '<div class="stint" style="--c:'+c+'"><span class="n">'+s.number+'</span>'
          +'<span class="t">'+fmt(s.start_at)+' – '+fmt(s.end_at)+'</span>'
          +'<span class="track">'+esc(info.join(" · "))+'</span>'
          +'<span class="tag'+tag.cls+'">'+tag.label+'</span></div>';
      }).join("");
      return '<div class="event"><h2>'+esc(g.event.name||"")+(g.event.track?' <span class="trk">· '+esc(g.event.track)+'</span>':"")+'</h2>'+rows+'</div>';
    }).join("");
  }).catch(()=>{box.innerHTML='<p class="empty">Konnte Daten nicht laden.</p>'});
}
render();
</script>
<script src="../nav.js"></script>
</body>
</html>
