<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden – CRTG</title>
<style>
main{max-width:460px;margin:8vh auto 0;padding:0 20px;text-align:center}
.box{background:rgba(19,24,48,.9);border:1px solid var(--line);border-top:4px solid var(--vi);border-radius:18px;padding:30px 26px}
.box img{width:110px;height:110px;border-radius:22px}
h1{margin:14px 0 6px;font-size:2rem;font-style:italic;font-weight:800}
p{color:var(--mute);margin:0 0 22px}
.btn.go{padding:12px 22px;font-size:1.1rem}
#msg{color:#ff8a8a;margin:0 0 18px}
#msg:empty{display:none}
</style>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<main>
  <div class="box">
    <img src="icon.png" alt="CRTG">
    <h1>Anmelden</h1>
    <p>Melde dich mit deinem Discord-Konto an. Du brauchst vorher die Freischaltung durch einen Admin.</p>
    <div id="msg" role="alert"></div>
    <a class="btn go" href="/api/auth/login">Mit Discord anmelden</a>
  </div>
</main>
<script src="nav.js"></script>
<script>
const E={guild:"Du bist nicht Mitglied auf unserem Discord-Server.",inactive:"Dein Konto ist deaktiviert. Melde dich bei einem Admin.",state:"Die Anmeldung ist abgelaufen. Bitte versuche es noch einmal.",discord:"Discord hat die Anmeldung abgelehnt oder ist gerade nicht erreichbar."};
document.getElementById("msg").textContent=E[new URLSearchParams(location.search).get("error")]||"";
</script>
</body>
</html>
