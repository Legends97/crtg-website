<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRTG Stintplaner</title>
<style>
:root{color-scheme:dark;--bg:#0b0e1b;--panel:#131830;--panel2:#1a2040;--line:#2a3157;--text:#eaedfa;--mute:#8f98bd;--cy:#2bd0ff;--vi:#9b6bff}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.45 "Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
background:radial-gradient(900px 500px at 8% -10%,rgba(43,208,255,.16),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(155,107,255,.18),transparent 60%),var(--bg)}
header{max-width:1280px;margin:auto;padding:26px 24px 14px}
h1{margin:0;font-size:2.5rem;font-style:italic;font-weight:800;letter-spacing:.01em;line-height:1.1;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sub{color:var(--mute);margin-top:2px}
.back{color:var(--cy);text-decoration:none}.back:hover{text-decoration:underline}
.stripe{height:4px;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,var(--cy),var(--vi) 60%,transparent)}
main{display:grid;grid-template-columns:330px 1fr;gap:22px;padding:8px 24px 48px;max-width:1280px;margin:auto;align-items:start}
@media(max-width:880px){main{grid-template-columns:1fr;padding:8px 14px 40px}header{padding:20px 14px 10px}h1{font-size:2rem}}
section{background:rgba(19,24,48,.88);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{margin:0 0 4px;font-size:1.15rem;font-weight:700}
label{display:block;color:var(--mute);font-size:.85rem;margin:14px 0 5px}
input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
button:hover{border-color:var(--cy)}button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.go{background:linear-gradient(90deg,#0f8fb0,#6a45d6);border-color:transparent;font-weight:600}
.hero{display:flex;flex-wrap:wrap;gap:12px 36px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.trk{font-size:2.1rem;font-style:italic;font-weight:800;line-height:1.1}
.meta{color:var(--mute);font-size:.9rem;margin-top:3px}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-size:1.8rem;line-height:1.1;color:var(--cy);font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:.85rem}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:12px;padding:12px 16px;margin:0 0 16px}
.banner b{font-size:1.15rem}
.banner .cd{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.4rem;font-style:italic;color:var(--c,var(--cy))}
.banner small{color:var(--mute);display:block}
.banner.open{--c:var(--cy)}.banner.soon{--c:var(--vi)}.banner.closed{--c:#ffa94d}.banner.locked{--c:#3ddc97}.banner.draft{--c:var(--mute)}.banner.off{--c:#ff5d6c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.cell{background:var(--panel2);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:8px 11px;min-width:0}
.cell .n{font-size:1.5rem;font-weight:800;font-style:italic;color:var(--c);line-height:1.1}
.cell .t{font-variant-numeric:tabular-nums;font-weight:600}
.cell .who{margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .fu{color:var(--mute);font-size:.8rem;font-variant-numeric:tabular-nums}
.cell select{margin-top:4px;padding:5px 7px;font-size:.9rem}
.cell.free{--c:var(--mute)}.cell.free .who{color:var(--mute)}
.cell.mine{--c:var(--cy)}
.cell.other{--c:var(--vi)}
.cell.past{opacity:.5}
.cell.hit{cursor:pointer}.cell.hit:hover{border-color:var(--cy)}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--mute);font-size:.85rem;margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hint{color:var(--mute);font-size:.85rem;margin-top:10px}
.empty{color:var(--mute);padding:20px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--cy);padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:92vw;text-align:center}
#toast.on{opacity:1}
body.ro .cfg{display:none}
body.ro main{grid-template-columns:1fr}
@media print{
@page{size:A4 portrait;margin:14mm}
body{background:#fff;color:#111;font-size:12pt}
.cfg,.actions,.no-print,.stripe,.sub{display:none!important}
header{padding:0 0 8px}
h1{background:none;color:#111;-webkit-text-fill-color:#111;font-size:22pt}
main{display:block;padding:0;max-width:none}
section{background:none;border:0;padding:0}
.trk{font-size:20pt}.stat b{color:#111}
.cell{background:#fff;border:1px solid #bbb;border-left:7px solid var(--c);break-inside:avoid}
.cell select{display:none}
}
</style>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<header>
  <h1>CRTG Stintplaner</h1>
  <div class="sub">ChaosRacing – Team Germany</div>
  <div class="stripe"></div>
</header>
<main>
  <section class="cfg" aria-label="Event verwalten">
    <h2>Event</h2>
    <div class="actions" style="margin-top:10px">
      <button id="fNew" type="button">Neues Event</button>
      <button id="fEdit" type="button">Ausgewähltes bearbeiten</button>
    </div>
    <label for="fName">Name</label>
    <input id="fName" placeholder="z. B. 6H Spa">
    <label for="fTrack">Strecke</label>
    <select id="fTrack"></select>
    <label for="fClass">Klasse</label>
    <input id="fClass" placeholder="z. B. GT3">
    <div class="two">
      <div><label for="fStart">Start (lokal)</label><input id="fStart" type="datetime-local"></div>
      <div><label for="fHours">Dauer (h)</label><input id="fHours" type="number" min="1" max="48" step="1"></div>
    </div>
    <h2 style="margin-top:22px">Anmeldefenster</h2>
    <div class="two">
      <div><label for="fOpenD">Tage vorher öffnen</label><input id="fOpenD" type="number" min="0" step="0.5"></div>
      <div><label for="fCloseD">Tage vorher schließen</label><input id="fCloseD" type="number" min="0" step="0.5"></div>
    </div>
    <p class="hint" id="fPrev"></p>
    <div class="two">
      <div><label for="fOpenAt">Öffnet (direkt, optional)</label><input id="fOpenAt" type="datetime-local"></div>
      <div><label for="fCloseAt">Schließt (direkt, optional)</label><input id="fCloseAt" type="datetime-local"></div>
    </div>
    <h2 style="margin-top:22px">Sprit</h2>
    <label for="fLap">Rundenzeit (m:ss.x)</label>
    <input id="fLap" placeholder="1:48.5">
    <div class="two">
      <div><label for="fCons">Verbrauch/Runde (L)</label><input id="fCons" type="number" step="0.01" min="0"></div>
      <div><label for="fTank">Tank (L)</label><input id="fTank" type="number" step="1" min="0"></div>
    </div>
    <label for="fRes">Reserve (Runden)</label>
    <input id="fRes" type="number" step="1" min="0" placeholder="1">
    <h2 style="margin-top:22px">Erinnerungen &amp; Discord</h2>
    <label for="fLead">Erinnerungsstufen (Minuten vorher, kommagetrennt)</label>
    <input id="fLead" placeholder="1440,120,20">
    <div class="two">
      <div><label for="fGuild">Server-ID (optional)</label><input id="fGuild" placeholder="Server-Standard"></div>
      <div><label for="fVoice">Voice-Kanal-ID (optional)</label><input id="fVoice" placeholder="Server-Standard"></div>
    </div>
    <div class="actions">
      <button class="go" id="fSave" type="button">Speichern</button>
    </div>
    <p class="hint" id="fHint"></p>
  </section>

  <section aria-label="Stintplan">
    <label for="evSel" style="margin-top:0">Event</label>
    <select id="evSel"><option value="">Lädt …</option></select>
    <div id="view"></div>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
const TRACKS=["Barcelona","Brands Hatch","Circuit of the Americas","Donington Park","Hungaroring","Imola","Indianapolis","Kyalami","Laguna Seca","Misano","Monza","Mount Panorama (Bathurst)","Nürburgring","Nürburgring Nordschleife 24H","Oulton Park","Paul Ricard","Red Bull Ring","Silverstone","Snetterton","Spa-Francorchamps","Suzuka","Valencia","Watkins Glen","Zandvoort","Zolder"];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
// Server-Antworten: immer JSON, Fehler als {error}. Timestamps kommen als UTC-ISO rein und raus.
async function api(path,opt){
  const r=await fetch(path,Object.assign({credentials:"same-origin"},opt));
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||("Fehler "+r.status));
  return d;
}
const body=(method,obj)=>({method,headers:{"Content-Type":"application/json"},body:JSON.stringify(obj||{})});
const T=iso=>new Date(iso).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const DT=iso=>new Date(iso).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});
const D=iso=>new Date(iso).toLocaleDateString([],{day:"2-digit",month:"2-digit",year:"numeric"});
const toInput=iso=>{const d=new Date(iso);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};

let ME=null,ADMIN=false,EVENTS=[],EV=null,DETAIL=null,USERS=[],openCell=null,editId=null;

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}

// Spiegelt eventPhase() aus api/index.js: /api/admin/events liefert keine Phase mit,
// und die Phase von /api/events veraltet, solange die Seite offen bleibt.
function phaseOf(e,now){
  if(!e)return null;
  if(e.status==="draft"||e.status==="locked"||e.status==="done"||e.status==="cancelled")return e.status;
  if(e.status==="assigning")return "after_signup";
  if(now<new Date(e.signup_opens_at))return "before_signup";
  if(now<=new Date(e.signup_closes_at))return "signup_open";
  return "after_signup";
}
const STATUS={draft:"Entwurf",signup:"Anmeldung",assigning:"Verteilung",locked:"Festgeschrieben",done:"Gelaufen",cancelled:"Abgesagt"};

// Entwürfe liefert /api/v1/events/:id nicht aus (status<>'draft'), deshalb das Raster
// für Entwürfe lokal aus start_at/duration_minutes bauen.
function stints(){
  if(DETAIL)return DETAIL.stints;
  if(!EV)return [];
  const t0=new Date(EV.start_at).getTime(),a=[];
  for(let i=0;i<EV.duration_minutes/60;i++)a.push({
    number:i+1,start_at:new Date(t0+i*36e5).toISOString(),end_at:new Date(t0+(i+1)*36e5).toISOString(),
    fuel_liters:null,pit_stops:0,assigned_user:null,
  });
  return a;
}
const isMine=s=>!!(s.assigned_user&&ME&&((ME.discord_id&&s.assigned_user.discord_id===ME.discord_id)||s.assigned_user.display_name===ME.display_name));
const userLabel=u=>u.car_number!=null?"#"+u.car_number+" "+u.display_name:u.display_name;
const userIdOf=s=>{
  if(!s.assigned_user)return "";
  const u=USERS.find(x=>x.discord_id&&x.discord_id===s.assigned_user.discord_id)||USERS.find(x=>x.display_name===s.assigned_user.display_name);
  return u?u.id:"";
};

function renderBanner(){
  const el=$("banner");
  if(!el||!EV)return;
  const now=new Date(),ph=phaseOf(EV,now);
  const set=(cls,html)=>{el.className="banner "+cls;el.innerHTML=html};
  if(ph==="draft")return set("draft","<div><b>Entwurf</b><small>Noch nicht veröffentlicht – nur für Admins sichtbar.</small></div>");
  if(ph==="before_signup")return set("soon","<div><b>Anmeldung noch nicht offen</b><small>Öffnet am "+esc(DT(EV.signup_opens_at))+".</small></div>");
  if(ph==="signup_open"){
    const left=new Date(EV.signup_closes_at)-now,mins=Math.max(0,Math.floor(left/60000));
    const d=Math.floor(mins/1440),h=Math.floor(mins%1440/60),m=mins%60;
    const txt=d>0?d+" Tag"+(d===1?"":"en")+", "+h+" Stunde"+(h===1?"":"n"):h>0?h+" Stunde"+(h===1?"":"n")+", "+m+" Minute"+(m===1?"":"n"):m+" Minute"+(m===1?"":"n");
    return set("open","<div><b>Anmeldung schließt in</b><small>Bis "+esc(DT(EV.signup_closes_at))+" – freie Stunden anklicken.</small></div><span class=\"cd\">"+esc(txt)+"</span>");
  }
  if(ph==="after_signup")return set("closed","<div><b>Anmeldung geschlossen</b><small>Wer sich nicht einträgt, bekommt was noch frei ist.</small></div>");
  if(ph==="locked")return set("locked","<div><b>Plan festgeschrieben</b><small>Erinnerungen sind erzeugt. Änderungen nur noch durch einen Admin.</small></div>");
  if(ph==="done")return set("locked","<div><b>Rennen gelaufen</b><small>Dieser Plan ist Archiv.</small></div>");
  return set("off","<div><b>Abgesagt</b><small>Dieses Event findet nicht statt.</small></div>");
}

function renderGrid(){
  const el=$("grid");
  if(!el)return;
  const now=Date.now(),list=stints(),ph=phaseOf(EV,new Date());
  const canClaim=ph==="signup_open",canRelease=EV.status!=="locked";
  el.innerHTML=list.map(s=>{
    const past=new Date(s.end_at).getTime()<=now,mine=isMine(s);
    const cls=["cell",mine?"mine":s.assigned_user?"other":"free",past?"past":""];
    const hit=ADMIN||(!past&&(mine?canRelease:!s.assigned_user&&canClaim));
    if(hit)cls.push("hit");
    const who=mine?"Du":s.assigned_user?esc(s.assigned_user.display_name):"frei";
    const sel=ADMIN&&openCell===s.number
      ?'<select data-as="'+s.number+'" aria-label="Fahrer für Stint '+s.number+'"><option value="">— frei —</option>'
        +USERS.map(u=>'<option value="'+u.id+'"'+(u.id===userIdOf(s)?" selected":"")+">"+esc(userLabel(u))+"</option>").join("")+"</select>"
      :"";
    const fuel=s.fuel_liters!=null?'<div class="fu">'+esc(String(s.fuel_liters).replace(".",","))+" L"+(s.pit_stops?" · "+s.pit_stops+" Stopp"+(s.pit_stops===1?"":"s"):"")+"</div>":"";
    return '<div class="'+cls.join(" ")+'" data-n="'+s.number+'"><div class="n">'+s.number+'</div><div class="t">'
      +esc(T(s.start_at))+" – "+esc(T(s.end_at))+'</div><div class="who">'+who+"</div>"+fuel+sel+"</div>";
  }).join("");
}

function renderView(){
  const v=$("view");
  if(!EV){v.innerHTML='<p class="empty">Kein Event vorhanden.</p>';return}
  const list=stints(),assigned=list.filter(s=>s.assigned_user).length,mine=list.filter(isMine).length;
  const stat=(b,l)=>'<div class="stat"><b>'+b+'</b><span>'+l+"</span></div>";
  v.innerHTML='<div class="hero"><div><div class="trk">'+esc(EV.track)+'</div><div class="meta">'+esc(EV.name)
    +(EV.car_class?" · "+esc(EV.car_class):"")+" · Start "+esc(DT(EV.start_at))+" · "+STATUS[EV.status]
    +(EV.reminder_lead_times?" · Erinnerungen "+esc(EV.reminder_lead_times.join(", "))+" min":"")+"</div></div>"
    +'<div class="stats">'+stat(EV.duration_minutes/60+" h","Renndauer")+stat(assigned+" / "+list.length,"Stints belegt")+stat(mine,"davon deine")+"</div></div>"
    +'<div id="banner" class="banner"></div><div class="grid" id="grid"></div>'
    +'<div class="legend"><span style="--c:var(--mute)"><i></i>frei</span><span style="--c:var(--cy)"><i></i>deine Stunde</span>'
    +'<span style="--c:var(--vi)"><i></i>anderer Fahrer</span><span style="--c:var(--line)"><i></i>vorbei (blass)</span></div>'
    +'<p class="hint" id="gridHint"></p><div class="actions" id="evActions"></div>';
  renderBanner();renderGrid();

  const ph=phaseOf(EV,new Date());
  $("gridHint").textContent=ADMIN
    ?"Admin: Feld anklicken, um einen Fahrer direkt zuzuweisen oder freizugeben – jederzeit, unabhängig vom Anmeldefenster."
    :ph==="signup_open"?"Freie Stunde anklicken = eintragen. Eigene Stunde anklicken = wieder freigeben."
    :ph==="before_signup"?"Sobald die Anmeldung öffnet, kannst du hier freie Stunden anklicken."
    :EV.status==="locked"?"Der Plan ist festgeschrieben.":"Eintragen ist nur während des Anmeldefensters möglich.";

  if(!ADMIN)return;
  const now=new Date();
  const btn=(id,txt,on,cls)=>'<button type="button" id="'+id+'"'+(cls?' class="'+cls+'"':"")+(on?"":" disabled")+">"+txt+"</button>";
  const closed=!!EV.signup_closes_at&&now>=new Date(EV.signup_closes_at);
  $("evActions").innerHTML=
    (EV.status==="draft"?btn("doPub","Veröffentlichen",true,"go"):"")
    +(EV.status==="signup"?btn("doDist","Freie Stints verteilen",closed):"")
    +(EV.status==="signup"||EV.status==="assigning"?btn("doLock","Plan festschreiben",true):"");
  if($("doPub"))$("doPub").onclick=()=>act("publish","Event veröffentlichen? Danach ist die Anmeldung sichtbar.");
  if($("doDist"))$("doDist").onclick=()=>act("distribute","Freie Stints automatisch auf Fahrer ohne Stint verteilen?");
  if($("doLock"))$("doLock").onclick=()=>act("lock","Plan festschreiben? Danach werden die Discord-Erinnerungen erzeugt.");
}

async function act(what,ask){
  if(!confirm(ask))return;
  try{
    const r=await api("/api/admin/events/"+EV.id+"/"+what,body("POST"));
    toast(what==="distribute"?"Verteilt: "+(r.assigned!=null?r.assigned+" Stints":"fertig"):"Erledigt ✓");
    await load(EV.id);
  }catch(e){toast(e.message)}
}

async function claim(n){
  try{await api("/api/events/"+EV.id+"/stints/"+n+"/claim",body("POST"));await load(EV.id);toast("Eingetragen ✓")}
  catch(e){toast(e.message);await load(EV.id)}
}
async function release(n){
  if(!confirm("Stunde "+n+" wieder freigeben?"))return;
  try{await api("/api/events/"+EV.id+"/stints/"+n+"/claim",body("DELETE"));await load(EV.id);toast("Freigegeben ✓")}
  catch(e){toast(e.message);await load(EV.id)}
}
async function assign(n,userId){
  try{
    await api("/api/admin/events/"+EV.id+"/stints/"+n,body("PATCH",{assigned_user_id:userId===""?null:+userId}));
    openCell=null;await load(EV.id);toast("Zugewiesen ✓");
  }catch(e){toast(e.message)}
}

$("view").onclick=e=>{
  if(e.target.tagName==="SELECT"||e.target.tagName==="OPTION")return;
  const cell=e.target.closest(".cell");
  if(!cell||!EV)return;
  const n=+cell.dataset.n,s=stints().find(x=>x.number===n);
  if(!s)return;
  if(ADMIN){
    openCell=openCell===n?null:n;renderGrid();return;
  }
  if(new Date(s.end_at)<=new Date())return;
  if(isMine(s))return EV.status==="locked"?toast("Plan ist festgeschrieben."):release(n);
  if(s.assigned_user)return toast("Diese Stunde hat schon "+s.assigned_user.display_name+".");
  if(phaseOf(EV,new Date())!=="signup_open")return toast("Eintragen ist nur während des Anmeldefensters möglich.");
  claim(n);
};
$("view").onchange=e=>{const n=e.target.dataset.as;if(n!==undefined)assign(+n,e.target.value)};

// --- Admin-Formular -------------------------------------------------------
function fillForm(e){
  editId=e?e.id:null;
  $("fName").value=e?e.name:"";
  $("fTrack").value=e&&TRACKS.includes(e.track)?e.track:"Spa-Francorchamps";
  $("fClass").value=e?e.car_class||"":"";
  $("fStart").value=e?toInput(e.start_at):"";
  $("fHours").value=e?e.duration_minutes/60:"";
  $("fOpenD").value=e&&e.signup_opens_offset_minutes!=null?e.signup_opens_offset_minutes/1440:e?"":7;
  $("fCloseD").value=e&&e.signup_closes_offset_minutes!=null?e.signup_closes_offset_minutes/1440:e?"":2;
  $("fOpenAt").value=e&&e.signup_opens_offset_minutes==null&&e.signup_opens_at?toInput(e.signup_opens_at):"";
  $("fCloseAt").value=e&&e.signup_closes_offset_minutes==null&&e.signup_closes_at?toInput(e.signup_closes_at):"";
  $("fLap").value=e&&e.lap_seconds!=null?Math.floor(e.lap_seconds/60)+":"+(e.lap_seconds%60<10?"0":"")+(Math.round(e.lap_seconds%60*10)/10):"";
  $("fCons").value=e&&e.fuel_cons_per_lap!=null?e.fuel_cons_per_lap:"";
  $("fTank").value=e&&e.tank_liters!=null?e.tank_liters:"";
  $("fRes").value=e&&e.fuel_reserve_laps!=null?e.fuel_reserve_laps:"";
  $("fLead").value=e&&e.reminder_lead_times?e.reminder_lead_times.join(","):"";
  $("fGuild").value=e&&e.guild_id?e.guild_id:"";
  $("fVoice").value=e&&e.voice_channel_id?e.voice_channel_id:"";
  $("fSave").textContent=editId?"Änderungen speichern":"Event anlegen";
  $("fHint").textContent=editId?"Bearbeitet: „"+e.name+"“.":"Neues Event. Nach dem Anlegen entstehen die Stunden-Stints automatisch.";
  preview();
}
function preview(){
  const st=$("fStart").value,p=(d,at,lab)=>{
    if(at)return lab+" "+DT(new Date(at).toISOString());
    const v=parseFloat(d);
    if(!st||!(v>=0))return lab+" –";
    return lab+" "+DT(new Date(new Date(st).getTime()-v*1440*60000).toISOString());
  };
  $("fPrev").textContent=p($("fOpenD").value,$("fOpenAt").value,"Öffnet:")+" · "+p($("fCloseD").value,$("fCloseAt").value,"Schließt:");
}
function formBody(){
  const start=$("fStart").value;
  if(!$("fName").value.trim())throw new Error("Name fehlt.");
  if(!start)throw new Error("Startzeit fehlt.");
  const h=+$("fHours").value;
  if(!Number.isInteger(h)||h<1)throw new Error("Dauer in ganzen Stunden angeben (mindestens 1).");
  const b={
    name:$("fName").value.trim(),track:$("fTrack").value,car_class:$("fClass").value.trim(),
    start_at:new Date(start).toISOString(),duration_minutes:h*60,
    lap_seconds:$("fLap").value.trim(),fuel_cons_per_lap:$("fCons").value,tank_liters:$("fTank").value,
    fuel_reserve_laps:$("fRes").value===""?1:+$("fRes").value,
  };
  [["opens","fOpenD","fOpenAt","Öffnen"],["closes","fCloseD","fCloseAt","Schließen"]].forEach(([k,dId,atId,lab])=>{
    const at=$(atId).value;
    if(at){b["signup_"+k+"_at"]=new Date(at).toISOString();b["signup_"+k+"_offset_minutes"]=null}
    else{
      const v=parseFloat($(dId).value);
      if(!(v>=0))throw new Error("Anmeldefenster "+lab+": Tage vorher oder direkte Zeit angeben.");
      b["signup_"+k+"_offset_minutes"]=Math.round(v*1440);
    }
  });
  const lead=$("fLead").value.trim();
  if(lead){
    const arr=lead.split(",").map(s=>parseInt(s.trim(),10));
    if(!arr.length||arr.some(n=>!Number.isInteger(n)||n<=0))
      throw new Error("Erinnerungsstufen: kommagetrennte Liste positiver Minuten-Werte angeben (z. B. 1440,120,20).");
    b.reminder_lead_times=arr;
  }
  b.guild_id=$("fGuild").value.trim()||null;
  b.voice_channel_id=$("fVoice").value.trim()||null;
  return b;
}
$("fSave").onclick=async()=>{
  try{
    const b=formBody();
    const ev=editId?await api("/api/admin/events/"+editId,body("PATCH",b)):await api("/api/admin/events",body("POST",b));
    toast(editId?"Gespeichert ✓":"Event angelegt ✓");
    editId=ev.id;
    await load(ev.id);
  }catch(e){toast(e.message)}
};
$("fNew").onclick=()=>fillForm(null);
$("fEdit").onclick=()=>EV?fillForm(EV):toast("Kein Event ausgewählt.");
["fStart","fOpenD","fCloseD","fOpenAt","fCloseAt"].forEach(id=>$(id).oninput=preview);

// --- Laden ---------------------------------------------------------------
const evLabel=e=>e.name+" · "+e.track+" · "+D(e.start_at)+" · "+STATUS[e.status]
  +(e.total!=null?" ("+e.assigned+"/"+e.total+")":"");
async function load(selectId){
  EVENTS=await api(ADMIN?"/api/admin/events":"/api/events").catch(e=>{toast(e.message);return []});
  EVENTS.sort((a,b)=>new Date(a.start_at)-new Date(b.start_at));
  const want=selectId!=null?selectId:(EV?EV.id:null);
  EV=EVENTS.find(e=>e.id===want)||EVENTS.find(e=>new Date(e.start_at)>=new Date())||EVENTS[0]||null;
  $("evSel").innerHTML=EVENTS.length
    ?EVENTS.map(e=>'<option value="'+e.id+'"'+(EV&&e.id===EV.id?" selected":"")+">"+esc(evLabel(e))+"</option>").join("")
    :'<option value="">Noch kein Event angelegt</option>';
  openCell=null;
  DETAIL=null;
  // Admin sieht Zuweisungen über jedem Status (inkl. draft) via die Admin-Detailroute;
  // Fahrer bleiben auf dem draft-ausschließenden /api/v1/-Vertrag.
  const detailUrl=ADMIN?(EV&&"/api/admin/events/"+EV.id):(EV&&EV.status!=="draft"&&"/api/v1/events/"+EV.id);
  if(detailUrl){
    try{DETAIL=await api(detailUrl)}catch(e){toast(e.message)}
  }
  renderView();
}
$("evSel").onchange=e=>load(+e.target.value);

(async function init(){
  $("fTrack").innerHTML=TRACKS.map(t=>'<option>'+esc(t)+"</option>").join("");
  ME=await fetch("/api/me",{credentials:"same-origin"}).then(r=>r.ok?r.json():null).catch(()=>null);
  ADMIN=!!ME&&ME.role==="admin";
  if(!ADMIN)document.body.classList.add("ro");
  if(ADMIN){
    USERS=await api("/api/admin/users").then(d=>d.users.filter(u=>u.active)).catch(()=>[]);
    fillForm(null);
  }
  await load();
  setInterval(renderBanner,30000);
})();
</script>
<script src="../nav.js"></script>
</body>
</html>
